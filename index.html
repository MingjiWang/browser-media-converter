<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browser Media Converter (GitHub Pages Debug)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .log-window::-webkit-scrollbar { width: 8px; }
    .log-window::-webkit-scrollbar-track { background: #0b1220; }
    .log-window::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    .log-window::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <header class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Media Converter</h1>
      <p class="text-slate-600">Runs locally in your browser • GitHub Pages friendly • extra debug</p>
    </header>

    <div class="bg-white rounded-xl shadow-lg p-6">

      <div class="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
        <p id="statusMsg" class="text-blue-800 font-mono text-sm mb-3">System Idle.</p>

        <div class="flex gap-3 items-center">
          <button id="initBtn"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition">
            Load Engine
          </button>

          <button id="clearLogsBtn"
            class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2 px-4 rounded shadow transition">
            Clear Logs
          </button>
        </div>

        <p class="mt-3 text-xs text-slate-600">
          If load takes &gt;60s, it’s usually: wrong/missing worker imports (const.js/errors.js) or worker crash.
        </p>
      </div>

      <div class="mb-6">
        <div class="text-xs text-slate-500 mb-1">Debug Logs</div>
        <div id="logs"
          class="log-window h-56 overflow-y-auto bg-slate-950 text-emerald-300 font-mono text-xs p-3 rounded"></div>
      </div>

      <div id="appInterface" class="opacity-40 pointer-events-none transition-opacity duration-300">
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:bg-slate-50 relative mb-6">
          <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          <p class="text-slate-500 pointer-events-none">Drop Video/Audio File Here</p>
          <p id="fileName" class="text-blue-600 font-bold mt-2 hidden"></p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Format</label>
            <select id="format" class="w-full border p-2 rounded bg-white">
              <optgroup label="Audio">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
                <option value="aac">AAC</option>
                <option value="flac">FLAC</option>
                <option value="aiff">AIFF</option>
              </optgroup>
              <optgroup label="Video">
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
                <option value="gif">GIF</option>
              </optgroup>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Quality</label>
            <select id="quality" class="w-full border p-2 rounded bg-white">
              <option value="">Standard</option>
              <option value="high">High (320k / 60fps-ish)</option>
            </select>
          </div>
        </div>

        <button id="convertBtn"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded shadow disabled:opacity-50 disabled:cursor-not-allowed"
          disabled>
          Convert File
        </button>

        <div id="outputArea" class="hidden mt-6 text-center bg-green-50 p-4 rounded border border-green-200">
          <p class="text-green-800 font-bold mb-2">Success!</p>
          <a id="dlLink" class="inline-block bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
            Download Result
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { FFmpeg } from "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
    import { fetchFile } from "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js";

    // Bump BUILD to defeat aggressive caching
    const BUILD = "20260110_003";

    const els = {
      initBtn: document.getElementById("initBtn"),
      clearLogsBtn: document.getElementById("clearLogsBtn"),
      status: document.getElementById("statusMsg"),
      app: document.getElementById("appInterface"),
      file: document.getElementById("fileInput"),
      fileName: document.getElementById("fileName"),
      format: document.getElementById("format"),
      quality: document.getElementById("quality"),
      convertBtn: document.getElementById("convertBtn"),
      logs: document.getElementById("logs"),
      dlLink: document.getElementById("dlLink"),
      output: document.getElementById("outputArea"),
    };

    const ts = () => new Date().toLocaleTimeString();
    function log(msg) {
      const line = document.createElement("div");
      line.textContent = `[${ts()}] ${msg}`;
      els.logs.appendChild(line);
      els.logs.scrollTop = els.logs.scrollHeight;
      console.log(msg);
    }
    function status(msg) {
      els.status.textContent = msg;
      log(`STATUS → ${msg}`);
    }

    // Catch silent crashes
    window.addEventListener("error", (e) => log(`❌ window.error: ${e.message} @ ${e.filename || ""}:${e.lineno || ""}`));
    window.addEventListener("unhandledrejection", (e) => log(`❌ unhandledrejection: ${e.reason?.message || e.reason}`));

    els.clearLogsBtn.addEventListener("click", () => {
      els.logs.innerHTML = "";
      log("Logs cleared.");
      log("BUILD = " + BUILD);
    });

    const mimeFor = (ext) => ({
      mp3: "audio/mpeg",
      wav: "audio/wav",
      aac: "audio/aac",
      flac: "audio/flac",
      aiff: "audio/aiff",
      mp4: "video/mp4",
      webm: "video/webm",
      gif: "image/gif",
    }[ext] || "application/octet-stream");

    function withTimeout(promise, ms, label) {
      let t;
      const timeout = new Promise((_, rej) => {
        t = setTimeout(() => rej(new Error(`${label} timed out after ${ms}ms`)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
    }

    async function assertFetchable(url, label, minBytes) {
      status(`Checking ${label}…`);
      log(`${label} url = ${url}`);

      const resp = await fetch(url, { cache: "no-store" });

      log(`${label} HTTP ${resp.status} ${resp.statusText}`);
      log(`${label} content-type = ${resp.headers.get("content-type") || "(none)"}`);
      log(`${label} content-length = ${resp.headers.get("content-length") || "(none)"}`);

      const buf = await resp.arrayBuffer();
      const bytes = buf.byteLength;
      const kb = bytes / 1024;
      const mb = bytes / (1024 * 1024);

      log(`${label} downloaded = ${bytes} bytes (${kb.toFixed(1)} KB / ${mb.toFixed(3)} MB)`);

      // Peek tiny responses (helps catch HTML/404 pages)
      if (bytes < 4096) {
        const head = new TextDecoder().decode(new Uint8Array(buf.slice(0, Math.min(bytes, 300))));
        log(`${label} head(<=300 chars) = ${JSON.stringify(head.slice(0, 300))}`);
      }

      if (!resp.ok) {
        const head = new TextDecoder().decode(new Uint8Array(buf.slice(0, Math.min(bytes, 300))));
        throw new Error(`${label} fetch failed: HTTP ${resp.status}. head=${head.slice(0,120)}`);
      }

      if (bytes < minBytes) {
        const head = new TextDecoder().decode(new Uint8Array(buf.slice(0, Math.min(bytes, 300))));
        throw new Error(`${label} too small (${bytes} bytes). head=${head.replace(/\s+/g," ").slice(0,120)}`);
      }
    }

    async function testWorker(classWorkerURL) {
      status("Testing worker startup…");
      log("Creating Worker: " + classWorkerURL);

      return await new Promise((resolve, reject) => {
        let done = false;
        const w = new Worker(classWorkerURL, { type: "module" });

        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          try { w.terminate(); } catch {}
          reject(new Error("Worker startup test timed out (no message from worker)"));
        }, 5000);

        w.onerror = (e) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          log(`❌ worker.onerror: ${e.message || "error"} @ ${e.filename || ""}:${e.lineno || ""}`);
          try { w.terminate(); } catch {}
          reject(new Error("Worker error event fired (see logs)"));
        };

        w.onmessageerror = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          log("❌ worker.onmessageerror: message could not be deserialized");
          try { w.terminate(); } catch {}
          reject(new Error("Worker messageerror"));
        };

        w.onmessage = (ev) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          log("✅ worker.onmessage received: " + JSON.stringify(ev.data).slice(0, 200));
          try { w.terminate(); } catch {}
          resolve(true);
        };

        // We "poke" it; worker may ignore unknown messages, but error events will still fire if imports fail.
        try {
          w.postMessage({ ping: true, t: Date.now() });
          log("Sent ping to worker");
        } catch (err) {
          log("❌ Failed to postMessage to worker: " + err.message);
        }
      });
    }

    let ffmpeg = null;
    let engineLoaded = false;

    async function loadEngine() {
      els.initBtn.disabled = true;
      els.convertBtn.disabled = true;
      els.output.classList.add("hidden");
      engineLoaded = false;

      try {
        log("BUILD = " + BUILD);
        status("Starting engine bootstrap…");

        ffmpeg = new FFmpeg();
        ffmpeg.on("log", ({ message }) => log(`ffmpeg> ${message}`));
        ffmpeg.on("progress", ({ progress }) => status(`Processing: ${Math.round(progress * 100)}%`));

        // ✅ Matched versions for core.js + wasm
        const coreURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.js";
        const wasmURL = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.wasm";

        // ✅ Local worker + its local module imports (const.js/errors.js) must exist in your repo root
        const classWorkerURL = new URL(`./worker.js?v=${BUILD}`, import.meta.url).toString();
        const constURL = new URL(`./const.js?v=${BUILD}`, import.meta.url).toString();
        const errorsURL = new URL(`./errors.js?v=${BUILD}`, import.meta.url).toString();

        // Preflight checks: these catch 404/HTML responses immediately
        await assertFetchable(classWorkerURL, "worker.js (local)", 10_000);
        await assertFetchable(constURL, "const.js (local)", 200);
        await assertFetchable(errorsURL, "errors.js (local)", 200);

        await assertFetchable(coreURL, "ffmpeg-core.js (CDN)", 50_000);
        await assertFetchable(wasmURL, "ffmpeg-core.wasm (CDN)", 5_000_000);

        // Worker sanity test (imports failing will show as worker.onerror)
        await testWorker(classWorkerURL);

        status("Calling ffmpeg.load()…");
        await withTimeout(
          ffmpeg.load({ coreURL, wasmURL, classWorkerURL }),
          60000,
          "ffmpeg.load()"
        );

        engineLoaded = true;
        status("Engine Ready. Select a file.");
        els.app.classList.remove("opacity-40", "pointer-events-none");
        els.convertBtn.disabled = !els.file.files?.[0];
        els.initBtn.textContent = "Engine Loaded";
        els.initBtn.classList.add("opacity-60");
        log("Ready.");
      } catch (err) {
        console.error(err);
        status("ERROR: " + err.message);
        els.initBtn.disabled = false;
        els.initBtn.textContent = "Retry Load";
        alert("Engine failed to load. Check logs; it will usually show the exact missing/blocked file.");
      }
    }

    async function convert() {
      const file = els.file.files[0];
      if (!file || !engineLoaded) return;

      els.convertBtn.disabled = true;
      els.output.classList.add("hidden");
      status("Preparing…");

      const inputName = `input_${Date.now()}`;
      const outExt = els.format.value;
      const outputName = `output_${Date.now()}.${outExt}`;

      try {
        status("Writing input file…");
        await ffmpeg.writeFile(inputName, await fetchFile(file));

        const args = ["-i", inputName];

        if (["mp3","wav","aac","flac","aiff"].includes(outExt)) {
          args.push("-vn");
          if (els.quality.value === "high") args.push("-b:a", "320k");
        }

        if (["mp4","webm"].includes(outExt) && els.quality.value === "high") {
          args.push("-r", "60");
        }

        if (outExt === "gif" && els.quality.value === "high") {
          args.push("-r", "30");
        }

        args.push(outputName);

        log("Exec: " + args.join(" "));
        status("Converting…");
        await ffmpeg.exec(args);

        status("Reading output…");
        const data = await ffmpeg.readFile(outputName);

        const blob = new Blob([data.buffer], { type: mimeFor(outExt) });
        els.dlLink.href = URL.createObjectURL(blob);
        els.dlLink.download = `converted.${outExt}`;

        els.output.classList.remove("hidden");
        status("Complete!");
      } catch (err) {
        console.error(err);
        log("Convert error: " + err.message);
        alert("Conversion failed. Check logs.");
      } finally {
        try { await ffmpeg.deleteFile(inputName); } catch {}
        try { await ffmpeg.deleteFile(outputName); } catch {}
        els.convertBtn.disabled = false;
      }
    }

    els.initBtn.addEventListener("click", loadEngine);
    els.convertBtn.addEventListener("click", convert);

    els.file.addEventListener("change", (e) => {
      if (e.target.files?.[0]) {
        els.fileName.textContent = e.target.files[0].name;
        els.fileName.classList.remove("hidden");
        els.convertBtn.disabled = !engineLoaded;
      }
    });
  </script>
</body>
</html>
